# Render Blueprint (opsional). Alternatif: buat Web Service manual lewat dashboard Render
# dengan Root Directory "server", Build "npm install", Start "npm start".
services:
  - type: web
    name: project-planner-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: WA_PROVIDER
        value: baileys
      - key: FONNTE_TOKEN
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: CRON_ENABLED
        value: "true"
      - key: CRON_SCHEDULE
        value: "0 * * * *"
      - key: REMINDER_WINDOW_HOURS
        value: "24"
      - key: WA_SEND_DELAY_MS
        value: "4000"
      - key: CRON_SECRET
        generateValue: true
